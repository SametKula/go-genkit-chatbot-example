<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teknik Asistan</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap');
        
        :root {
            --bg-color: #0f111a;
            --chat-bg: rgba(25, 28, 41, 0.95);
            --accent: #f97316; /* Orange */
            --accent-hover: #ea580c;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --bot-bubble: rgba(30, 41, 59, 0.9);
            --user-bubble: linear-gradient(135deg, #f97316, #fb923c);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Outfit', sans-serif; }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            height: 100vh;
            background-image: radial-gradient(circle at top right, rgba(249, 115, 22, 0.1), transparent 40%),
                              radial-gradient(circle at bottom left, rgba(234, 88, 12, 0.05), transparent 40%);
            overflow: hidden;
        }

        /* Chat Widget Styles */
        .chat-widget {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
        }

        .chat-container {
            width: 400px;
            height: 600px;
            background: var(--chat-bg);
            border-radius: 24px;
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            display: none; /* Hidden by default */
            flex-direction: column;
            overflow: hidden;
            margin-bottom: 15px;
            animation: slideUp 0.3s ease-out forwards;
            transform-origin: bottom right;
        }

        .chat-container.active {
            display: flex;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: scale(0.9) translateY(20px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }

        .chat-toggle-btn {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: var(--accent);
            border: none;
            cursor: pointer;
            box-shadow: 0 10px 20px rgba(249, 115, 22, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }

        .chat-toggle-btn:hover {
            transform: scale(1.1);
            background: var(--accent-hover);
        }

        .chat-toggle-btn svg {
            fill: white;
            width: 30px;
            height: 30px;
        }

        .header {
            padding: 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(15, 17, 26, 0.2);
        }

        .header h1 {
            font-size: 1.2rem;
            font-weight: 600;
            background: linear-gradient(to right, #fb923c, #f97316);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .status {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.8rem;
            color: var(--text-secondary);
        }
        
        .status-dot {
            width: 8px;
            height: 8px;
            background-color: #ef4444;
            border-radius: 50%;
            transition: background-color 0.3s;
        }
        .status-dot.connected { background-color: #10b981; box-shadow: 0 0 10px #10b981; }

        .chat-box {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
            scroll-behavior: smooth;
        }

        /* Scrollbar styles */
        .chat-box::-webkit-scrollbar { width: 5px; }
        .chat-box::-webkit-scrollbar-track { background: transparent; }
        .chat-box::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 10px; }

        .message {
            max-width: 85%;
            padding: 12px 16px;
            border-radius: 18px;
            line-height: 1.4;
            font-size: 0.95rem;
            animation: fadeIn 0.3s ease-out forwards;
            word-wrap: break-word;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .user-message {
            align-self: flex-end;
            background: var(--user-bubble);
            border-bottom-right-radius: 4px;
            color: white;
        }

        .bot-message {
            align-self: flex-start;
            background: var(--bot-bubble);
            border-bottom-left-radius: 4px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            color: #e2e8f0;
        }

        .input-area {
            padding: 15px;
            background: rgba(15, 17, 26, 0.4);
            display: flex;
            gap: 10px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }

        input[type="text"] {
            flex: 1;
            padding: 12px 18px;
            border-radius: 25px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(255, 255, 255, 0.03);
            color: white;
            font-size: 0.9rem;
            outline: none;
            transition: all 0.3s ease;
        }

        input[type="text"]:focus {
            border-color: rgba(249, 115, 22, 0.5);
            background: rgba(255, 255, 255, 0.05);
            box-shadow: 0 0 0 3px rgba(249, 115, 22, 0.1);
        }

        #send-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: none;
            background: var(--accent);
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }

        #send-btn:hover {
            background: var(--accent-hover);
            transform: scale(1.05);
        }

        #send-btn svg {
            width: 20px;
            height: 20px;
            fill: white;
        }
        
        .loading {
            align-self: flex-start;
            display: none;
            gap: 4px;
            padding: 12px 16px;
            background: var(--bot-bubble);
            border-radius: 18px;
            border-bottom-left-radius: 4px;
        }
        
        .loading span {
            width: 6px; height: 6px;
            background: var(--accent);
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out both;
        }
        
        .loading span:nth-child(1) { animation-delay: -0.32s; }
        .loading span:nth-child(2) { animation-delay: -0.16s; }
        
        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }

        /* Close Button in Header */
        .close-chat {
            cursor: pointer;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            transition: color 0.2s;
        }
        .close-chat:hover { color: white; }
    </style>
</head>
<body>

<div class="chat-widget">
    <div class="chat-container" id="chat-container">
        <div class="header">
            <div style="display: flex; flex-direction: column; gap: 2px;">
                <h1>Teknik Asistan</h1>
                <div class="status">
                    <div class="status-dot" id="status-dot"></div>
                    <span id="status-text">Bağlanıyor...</span>
                </div>
            </div>
            <div class="close-chat" id="close-chat">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
            </div>
        </div>
        
        <div class="chat-box" id="chat-box">
            <div class="message bot-message">Merhaba! Ben Teknik Asistan. Ürünle ilgili sorunlarını çözmek veya bilgi almak için sana yardımcı olabilirim.</div>
            <div class="loading" id="loading"><span></span><span></span><span></span></div>
        </div>
        
        <div class="input-area">
            <input type="text" id="message-input" placeholder="Bir soru sorun..." autocomplete="off">
            <button id="send-btn">
                <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"></path></svg>
            </button>
        </div>
    </div>

    <button class="chat-toggle-btn" id="chat-toggle">
        <svg viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z"></path></svg>
    </button>
</div>

<script>
    const chatContainer = document.getElementById('chat-container');
    const chatToggle = document.getElementById('chat-toggle');
    const closeChat = document.getElementById('close-chat');
    const chatBox = document.getElementById('chat-box');
    const messageInput = document.getElementById('message-input');
    const sendBtn = document.getElementById('send-btn');
    const loading = document.getElementById('loading');
    const statusDot = document.getElementById('status-dot');
    const statusText = document.getElementById('status-text');

    // Toggle Chat
    chatToggle.addEventListener('click', () => {
        chatContainer.classList.toggle('active');
        if (chatContainer.classList.contains('active')) {
            messageInput.focus();
        }
    });

    closeChat.addEventListener('click', () => {
        chatContainer.classList.remove('active');
    });

    // Session ID
    const sessionId = "session-" + Math.random().toString(36).substr(2, 9);
    
    let ws;
    
    function connect() {
        ws = new WebSocket('ws://localhost:8080/ws');
        
        ws.onopen = () => {
            statusDot.classList.add('connected');
            statusText.textContent = 'Bağlı';
        };
        
        ws.onmessage = (event) => {
            hideLoading();
            const response = JSON.parse(event.data);
            if(response.error) {
                addMessage(response.error, 'bot-message', true);
            } else {
                const formatted = response.content.replace(/\n/g, '<br>');
                addMessage(formatted, 'bot-message');
            }
        };
        
        ws.onclose = () => {
            statusDot.classList.remove('connected');
            statusText.textContent = 'Bağlantı koptu...';
            setTimeout(connect, 3000);
        };
    }
    
    function addMessage(content, className, isError = false) {
        const msgDiv = document.createElement('div');
        msgDiv.className = `message ${className}`;
        if(isError) msgDiv.style.color = '#ef4444';
        msgDiv.innerHTML = content;
        chatBox.insertBefore(msgDiv, loading);
        chatBox.scrollTop = chatBox.scrollHeight;
    }
    
    function showLoading() {
        loading.style.display = 'flex';
        chatBox.scrollTop = chatBox.scrollHeight;
    }
    function hideLoading() {
        loading.style.display = 'none';
    }
    
    function sendMessage() {
        const text = messageInput.value.trim();
        if (!text || ws.readyState !== WebSocket.OPEN) return;
        
        addMessage(text, 'user-message');
        messageInput.value = '';
        showLoading();
        
        const payload = {
            session_id: sessionId,
            content: text
        };
        
        ws.send(JSON.stringify(payload));
    }
    
    sendBtn.addEventListener('click', sendMessage);
    messageInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') sendMessage();
    });
    
    connect();
</script>

</body>
</html>
